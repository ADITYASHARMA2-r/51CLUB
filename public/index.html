<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Coder Studio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <p class="badge">Powerful AI for Coders</p>
        <h1>AI Coder Studio</h1>
        <p>
          Describe any app, website, or game idea. This AI returns architecture, files,
          and ready-to-run code like a coding copilot.
        </p>
      </header>

      <section class="card">
        <label for="prompt">What do you want to build?</label>
        <textarea
          id="prompt"
          rows="7"
          placeholder="Example: I want a multiplayer 2D shooting game with login, leaderboard, and room code."
        ></textarea>

        <div class="actions">
          <button id="generateBtn">Generate Project</button>
          <span id="status"></span>
        </div>
      </section>

      <section class="card">
        <h2>AI Output</h2>
        <pre id="output">Your generated code plan will appear here...</pre>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
